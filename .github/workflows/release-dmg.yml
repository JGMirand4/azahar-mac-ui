name: release-dmg

# Gera o DMG do macOS (Apple Silicon) neste fork.
#  - Manualmente: aba Actions > release-dmg > Run workflow (o DMG fica como artefato).
#  - Ao criar uma tag "v*": alem do artefato, publica um Release com o DMG anexado.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Maquina do GitHub (se uma estiver sem vaga, tente outra)'
        type: choice
        default: macos-15
        options: [macos-15, macos-26, macos-15-intel]
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  dmg:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install tools
        run: brew install ninja spirv-tools
      - name: Build DMG
        env:
          BUILD_DIR: build/release
        run: ./tools/make_dmg.sh "${GITHUB_REF_NAME//\//-}"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Hanami-dmg
          path: dist/*.dmg
      - name: Publish release
        if: ${{ github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.dmg --title "Hanami $GITHUB_REF_NAME" --generate-notes
